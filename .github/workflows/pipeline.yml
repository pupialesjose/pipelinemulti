name: CI/CD Calculadora con Terraform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Docker build & push
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/calculadora:latest

      # Terraform
      - name: Terraform init
        run: terraform init
        working-directory: terraform/aws

      - name: Terraform apply
        run: terraform apply -auto-approve -var="aws_region=us-east-2" -var="ami_id=${{ secrets.AMI_ID }}" -var="key_name=${{ secrets.KEY_NAME }}" -var="docker_image=${{ secrets.DOCKERHUB_USERNAME }}/calculadora:latest"
        working-directory: terraform/aws

      - name: Obtener IP pública de la instancia
        id: tf_output
        run: |
          echo "INSTANCE_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT
        working-directory: terraform/aws

      - name: Esperar a que EC2 acepte SSH
        run: |
          echo "Esperando 60 segundos para que EC2 levante SSH..."
          sleep 60

      # Update container de manera segura
      - name: Update app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_output.outputs.INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Instalar Docker si no está instalado
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt update
              sudo apt install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            # Detener y eliminar cualquier contenedor llamado "calculadora"
            for cid in $(sudo docker ps -aq --filter "name=calculadora"); do
              sudo docker stop $cid || true
              sudo docker rm $cid || true
            done

            # Detener y eliminar contenedores que usen el puerto 8080
            for cid in $(sudo docker ps -aq --filter "publish=8080"); do
              sudo docker stop $cid || true
              sudo docker rm $cid || true
            done

            # Lanza el nuevo contenedor
            sudo docker run -d -p 8080:8080 --name calculadora ${{ secrets.DOCKERHUB_USERNAME }}/calculadora:latest
