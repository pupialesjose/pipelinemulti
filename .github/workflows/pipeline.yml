name: CI/CD Calculadora AWS

on:
  push:
    branches:
      - main

jobs:
  deploy-aws:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # 3️⃣ Configurar credenciales de AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # 4️⃣ Login en Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5️⃣ Build y push de la imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/calculadora:latest

      # 6️⃣ Terraform Init
      - name: Terraform init
        run: terraform init
        working-directory: terraform/aws

      # 7️⃣ Terraform Apply
      - name: Terraform apply
        run: terraform apply -auto-approve \
              -var="aws_region=us-east-2" \
              -var="ami_id=${{ secrets.AMI_ID }}" \
              -var="key_name=${{ secrets.KEY_NAME }}" \
              -var="docker_image=${{ secrets.DOCKERHUB_USERNAME }}/calculadora:latest"
        working-directory: terraform/aws

      # 8️⃣ Obtener IP pública de la EC2
      - name: Obtener IP pública de la instancia
        id: tf_output
        run: |
          echo "INSTANCE_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT
        working-directory: terraform/aws

      # 9️⃣ Esperar a que SSH esté activo
      - name: Esperar a que EC2 acepte SSH
        run: sleep 30

      # 🔟 Deploy de la aplicación en la EC2
      - name: Update app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_output.outputs.INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo apt update
            sudo apt install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
            # Elimina contenedores previos si existían
            sudo docker stop calculadora || true
            sudo docker rm calculadora || true
            # Levanta el contenedor en el puerto 8080
            sudo docker run -d -p 8080:8080 --name calculadora ${{ secrets.DOCKERHUB_USERNAME }}/calculadora:latest

      # 11️⃣ Mostrar en logs la URL de la app
      - name: Mostrar URL de la aplicación
        run: |
          echo "Tu aplicación estará disponible en http://${{ steps.tf_output.outputs.INSTANCE_IP }}:8080"
